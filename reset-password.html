<!doctype html>
<html lang="nl" class="auth-pending">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reset your CryptoPulse AI Agent password.">
    <title>Wachtwoord herstellen · CryptoPulse</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/main.js" defer></script>
    <script src="/js/auth-service.js" defer></script>
    <script src="/js/auth.js" defer></script>
  </head>
  <body data-auth-page="reset">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true">C</span> CryptoPulse</a>
        <nav class="primary-nav" aria-label="Account navigation">
          <a data-nav-link href="/login.html">Inloggen</a>
          <a data-nav-link href="/register.html">Account aanmaken</a>
        </nav>
      </div>
    </header>
    <main class="page-shell">
      <p class="eyebrow">Accountbeveiliging</p>
      <h1>Herstel je wachtwoord.</h1>
      <section class="auth-card" aria-labelledby="reset-heading">
        <h2 id="reset-heading">Wachtwoord herstellen</h2>
        <form id="reset-request-form" method="post">
          <label for="reset-email">E-mailadres</label>
          <input id="reset-email" name="email" type="email" autocomplete="email" required>
          <button class="button-link" type="submit">Herstellink versturen</button>
        </form>
        <form id="reset-password-form" method="post" hidden>
          <label for="new-password">Nieuw wachtwoord</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <label for="confirm-new-password">Herhaal nieuw wachtwoord</label>
          <input id="confirm-new-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button class="button-link" type="submit">Wachtwoord opslaan</button>
        </form>
        <p data-auth-message role="status" aria-live="polite"></p>
        <div class="auth-links"><a href="/login.html">Terug naar inloggen</a></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-inner"><p>CryptoPulse AI Agent · <span data-current-year></span></p><p>PAPER ACTIVE · geen echte orders.</p></div>
    </footer>
  </body>
</html>
