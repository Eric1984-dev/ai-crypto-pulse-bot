<!doctype html>
<html lang="nl" class="auth-pending">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create a CryptoPulse AI Agent account.">
    <title>Registreren · CryptoPulse</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/main.js" defer></script>
    <script src="/js/auth-service.js" defer></script>
    <script src="/js/auth.js" defer></script>
  </head>
  <body data-auth-page="register">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true">C</span> CryptoPulse</a>
        <nav class="primary-nav" aria-label="Account navigation">
          <a data-nav-link href="/login.html">Inloggen</a>
          <a data-nav-link href="/register.html">Account aanmaken</a>
        </nav>
      </div>
    </header>
    <main class="page-shell">
      <p class="eyebrow">Account</p>
      <h1>Maak je account aan.</h1>
      <p class="page-description">Supabase Authentication beheert je account en e-mailbevestiging.</p>
      <section class="auth-card" aria-labelledby="register-heading">
        <h2 id="register-heading">Registreren</h2>
        <form id="register-form" method="post">
          <label for="register-email">E-mailadres</label>
          <input id="register-email" name="email" type="email" autocomplete="email" required>
          <label for="register-password">Wachtwoord</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <label for="register-confirm-password">Herhaal wachtwoord</label>
          <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button class="button-link" type="submit">Account aanmaken</button>
        </form>
        <p data-auth-message role="status" aria-live="polite"></p>
        <div class="auth-links"><a href="/login.html">Al een account? Inloggen</a></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-inner"><p>CryptoPulse AI Agent · <span data-current-year></span></p><p>PAPER ACTIVE · geen echte orders.</p></div>
    </footer>
  </body>
</html>
