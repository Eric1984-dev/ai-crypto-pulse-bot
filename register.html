<!doctype html>
<html lang="en" class="auth-pending">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create a CryptoPulse AI Agent account.">
    <meta name="apple-mobile-web-app-title" content="AI Crypto Bot">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b100f">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Create Account · CryptoPulse</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/main.js" defer></script>
    <script src="/js/auth-service.js" defer></script>
    <script src="/js/auth.js" defer></script>
  </head>
  <body data-auth-page="register">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" data-nav-link href="/dashboard.html"><img class="brand-mark" src="/assets/icons/apple-touch-icon.png" alt="" aria-hidden="true"> AI Crypto Bot <span class="paper-mode-badge">PAPER MODE</span></a>
        <nav class="primary-nav" aria-label="Account navigation">
          <details class="nav-dropdown">
            <summary class="nav-trigger">Menu</summary>
            <div class="nav-menu">
              <a data-nav-link href="/register.html">Create Account</a>
              <a data-nav-link href="/login.html">Sign In</a>
            </div>
          </details>
        </nav>
      </div>
    </header>
    <main class="page-shell">
      <p class="eyebrow">Account</p>
      <h1>Create your account.</h1>
      <p class="page-description">Supabase Authentication manages your account and email confirmation.</p>
      <section class="auth-card" aria-labelledby="register-heading">
        <h2 id="register-heading">Create Account</h2>
        <form id="register-form" method="post">
          <label for="register-email">Email address</label>
          <input id="register-email" name="email" type="email" autocomplete="email" required>
          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <label for="register-confirm-password">Confirm password</label>
          <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button class="button-link" type="submit">Create Account</button>
        </form>
        <p data-auth-message role="status" aria-live="polite"></p>
        <div class="auth-links"><a href="/login.html">Already have an account? Sign in</a></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-inner"><p>CryptoPulse AI Agent · <span data-current-year></span></p><p>PAPER ACTIVE · no real orders.</p></div>
    </footer>
  </body>
</html>
